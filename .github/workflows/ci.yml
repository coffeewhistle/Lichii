name: ci

on:
  pull_request:
    # A docs-only change cannot break the build or the tests.
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - nx2
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# A newer push to the same ref makes the run in progress obsolete, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      # Same LLVM major as the release build (PGO_LLVM_VERSION in release-binaries.yml). Ubuntu's
      # own clang 18 crashes (exit 139) on the nvdrv sources, so the toolchain comes from apt.llvm.org.
      LLVM_VERSION: "23"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # The dependency list of the linux-x86_64 job in release-binaries.yml, minus the Qt packages
      # and the xcb libraries: this build has ENABLE_QT=OFF, and the tests do not link Qt.
      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev \
            mesa-common-dev nasm ninja-build \
            libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache

      # The versioned packages are named explicitly: that repo's unversioned clang/lld are
      # meta-packages for a different major. lld ships ld.lld under /usr/lib/llvm-$LLVM_VERSION/bin,
      # so the Configure step passes -B there.
      - name: Install clang
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "lld-$LLVM_VERSION"
          "clang-$LLVM_VERSION" --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-ci-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-ci-v1-
            cpm-linux-x86_64-v2-
            cpm-Linux-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ci-objects-clang-v2-${{ hashFiles('CMakeLists.txt', 'cpmfile.json') }}-${{ github.sha }}
          restore-keys: |
            ci-objects-clang-v2-${{ hashFiles('CMakeLists.txt', 'cpmfile.json') }}-
            ci-objects-clang-v2-

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_COMPILER=clang-$LLVM_VERSION" \
            "-DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION" \
            "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$LLVM_VERSION/bin -fuse-ld=lld" \
            -DYUZU_TESTS=ON \
            -DENABLE_QT=OFF \
            -DYUZU_CMD=ON \
            -DENABLE_WEB_SERVICE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats

      # Save the objects even when the build fails, so the retry after a fix starts warm.
      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Run tests
        shell: bash
        run: ctest --test-dir build --output-on-failure
